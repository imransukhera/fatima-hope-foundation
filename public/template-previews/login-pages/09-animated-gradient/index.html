<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Animated Gradient</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand-mark">◆</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your workspace</p>

      <form class="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" placeholder="••••••••" required>
        </label>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="social-row">
        <button class="btn-social" type="button">Google</button>
        <button class="btn-social" type="button">Apple</button>
      </div>

      <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
    </section>
  </main>
</body>
</html>
