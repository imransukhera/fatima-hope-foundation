<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Material Design</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand-mark">M</div>
      <h1>Sign in</h1>
      <p class="subtitle">Use your account to continue</p>

      <form class="login-form">
        <div class="field">
          <input type="email" id="email" placeholder=" " required>
          <label for="email">Email address</label>
        </div>
        <div class="field">
          <input type="password" id="password" placeholder=" " required>
          <label for="password">Password</label>
        </div>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">SIGN IN</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <div class="social-row">
        <button class="btn-social" type="button">Continue with Google</button>
      </div>

      <p class="footer-text">Don't have an account? <a href="#">Register now</a></p>
    </section>
  </main>
</body>
</html>
